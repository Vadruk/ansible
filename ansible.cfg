

[defaults]
inventory = ./inventory/dev
roles_path = ./roles:~/ansible/roles
host_key_checking = False
remote_user = kriksus
private_key_file = ~/.ssh/id_rsa
timeout = 30
gathering = smart
fact_caching = memory
pipelining = True
interpreter_python = auto_silent
stdout_callback = yaml
bin_ansible_callbacks = True
display_args_to_stdout = False
show_custom_stats = True
log_path = ./logs/ansible.log
no_target_syslog = False
diff = always

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[persistent_connection]
connect_timeout = 30
command_timeout = 30

[colors]
highlight = white
verbose = blue
warn = bright purple
error = red
debug = dark gray
deprecate = purple
skip = cyan
unreachable = red
ok = green
changed = yellow
diff_add = green
diff_remove = red
diff_lines = cyan
